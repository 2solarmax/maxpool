name: Secret scan

# Whole-repo secret scanning with gitleaks (full git history on every push/PR).
# Any hit not allowlisted in .gitleaks.toml is a real finding: the repo stores
# no tokens (publish.yml uses npm Trusted Publishing / OIDC).
#
# Runs the gitleaks CLI directly rather than gitleaks/gitleaks-action@v2: the
# action requires a paid GITLEAKS_LICENSE for repos owned by an organization
# (this repo's upstream is org-owned), the CLI needs no license and no token.
# Allowlisted false positives live in .gitleaks.toml (exact literals only).
#
# Pinned binary: the tarball + sha256 are
# pinned here so an update is a deliberate, reviewable change.
# Next update: copy the new tag + linux_x64 sha256 from
# https://github.com/gitleaks/gitleaks/releases

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the pushed commit
      - name: Install pinned gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m755 gitleaks /usr/local/bin/gitleaks
      - name: Scan git history
        run: gitleaks git --no-banner --redact .
