# Maxpool background service — settings for its PRIVATE tmux server (own socket,
# started by launchd with -D -f, so your own ~/.tmux.conf never loads here).
# install.sh copies this file to <dir>/tmux.conf and appends the line that creates
# the `pool` session: tmux refuses a command together with -D, so the session has
# to come from the config.
set -s escape-time 10
set -g status off
set -g prefix None
unbind C-b
set -g window-size latest
# The dashboard reads Ctrl-C as "quit now". Here it only closes the view where it
# was pressed; the pool keeps running.
bind -n C-c detach-client
